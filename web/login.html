<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Climáticos | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand-mark">EC</div>
        <p class="eyebrow">MONITORAMENTO AMBIENTAL</p>
        <h1>Eventos Climáticos</h1>
        <p class="subtitle">Entre para gerenciar os registros climáticos.</p>
        <form id="loginForm">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seu@email.com" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Sua senha" required>
            <p id="mensagem" class="message" role="alert"></p>
            <button type="submit" class="button primary full">Entrar</button>
        </form>
        <p class="hint">Use um usuário cadastrado no banco de dados.</p>
    </main>
    <script src="login.js"></script>
</body>
</html>
